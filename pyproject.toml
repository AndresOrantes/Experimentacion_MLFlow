[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Experimentaci\u00f3n de un modelo de ML con MLflow, sklearn y aplicando estructura a los archivos con cookiecutter"
authors = [
  { name = "AndresOrantes" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "black",
    "flake8",
    "isort",
    "jupyter>=1.1.1",
    "loguru",
    "mkdocs",
    "mlflow>=3.17.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pip",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "tqdm",
    "typer",
    "ucimlrepo>=0.0.7",
]
requires-python = "~=3.11.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["src"]
force_sort_within_sections = true


